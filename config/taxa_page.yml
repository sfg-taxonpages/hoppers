taxa_page:
  overview:
    panels:
      - - - panel:gallery
          - panel:sounds
          - panel:descendants
          - panel:nomenclature
          - panel:nomenclature-references

        - - id: panel:map-v2
            bind:
              cluster: false
          - id: panel:3d-viewer
            bind:
              # Optional per-theme viewer background. Defaults:
              # background:
              #   light: '#f5f5f5'
              #   dark: '#111827'
              models:
                22289:
                  # url: 'stl/01_Thamnotettix_zelleri.stl'
                  uls: 'https://www.dropbox.com/scl/fi/z9a630ve0zkoezfba41uq/07_Thamnotettix_thrax.stl?rlkey=i53sty7ryxo0afw05t4xb7lix&dl=0'
                  description: 'Thamnotettix zelleri — 3D model designed by Radost Angelova (2026)'
          - panel:type
          - panel:type-specimen
          - panel:etymology
          - panel:content
          - panel:image-matrix
          - panel:keys
          - panel:statistics

  specimen_records:
    rank_group: ['SpeciesGroup']
    panels:
      - - - panel:specimen-records
  field_occurrences:
    rank_group: ['SpeciesGroup']
    panels:
      - - - panel:field-occurrences
  asserted_distributions:
    label: 'Asserted distribution'
    rank_group: ['SpeciesGroup']
    panels:
      - - - id: panel:asserted-distributions
  biological_associations:
    panels:
      - - - panel:biological-associations
  inaturalist:
    label: 'iNaturalist'
    rank_group: ['GenusGroup', 'SpeciesGroup']
    panels:
      - - - panel:inaturalist
