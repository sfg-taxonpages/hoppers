                  description: 'Thamnotettix dilutior — aedeagus, 3D model created by Radost Angelova (2026)'
                22249:
                  url: 'stl/03_T_minoidis_LR.glb'
                  description: 'Thamnotettix minoidis — aedeagus, 3D model created by Radost Angelova (2026)'
                22247:
                  url: 'stl/04_T_creticus_LR.glb'
                  description: 'Thamnotettix creticus — aedeagus, 3D model created by Radost Angelova (2026)'
                22220:
                  url: 'stl/05_T_confinis_LR.glb'
                  description: 'Thamnotettix confinis — aedeagus, 3D model created by Radost Angelova (2026)'
                22186:
                  url: 'stl/06_T_exemptus_LR.glb'
                  description: 'Thamnotettix exemtus — aedeagus, 3D model created by Radost Angelova (2026)'
