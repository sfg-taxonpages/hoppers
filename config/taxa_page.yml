      - - - panel:specimen-records
  field_occurrences:
    rank_group: ['SpeciesGroup']
    panels:
      - - - panel:field-occurrences
  asserted_distributions:
    label: 'Asserted distribution'
    rank_group: ['SpeciesGroup']
    panels:
      - - - id: panel:asserted-distributions
  biological_associations:
    panels:
      - - - panel:biological-associations
  inaturalist:
    label: 'iNaturalist'
    rank_group: ['GenusGroup', 'SpeciesGroup']
    panels:
      - - - panel:inaturalist
